# Example font: compact Ultra sample repertoire. See examples/README.md.
# Artwork adapted from Kody Brown's C# bigtext fonts.
# Legacy PC character numbers have been mapped to Unicode code points.
format_version: 1

font:
  id: ornate-frame-example
  name: Ornate frame example
  author: Kody Brown
  license: MIT
  description: Small Ultra sample with ornate corners and independent underline artwork.

metrics:
  height: 7
  baseline: 5
  spacing: 1
  space_width: 4

decorations:
  border:
    top: "▀"
    bottom: "▄"
    height: 1
    endcaps:
      left:
        top: ['  █▀', ' █▀ ', '█▀  ']
        middle: '█   '
        bottom: ['█▄  ', ' █▄ ', '  █▄']
      right:
        top: ['▀█  ', ' ▀█ ', '  ▀█']
        middle: '   █'
        bottom: ['  ▄█', ' ▄█ ', '▄█  ']
  underline:
    row: 6
    char: "▄"

