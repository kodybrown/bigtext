[package]
name = "bigtext"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Kody Brown <thewizard@wasatchwizard.com>"]
repository = "https://github.com/kodybrown/bigtext"
description = "Compose large Unicode text with editable fonts and ordered formatting"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
unicode-width = "0.2"
console = "0.15"

[dev-dependencies]
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
